<DOCTYPE! html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content = "width=device-width,initial-scale=1.0">
<title> Forms collection-Part 1</title>
</head>
<body>
<header>
<h1>Html Forms Collections</h1>
<p> 
Login Form and Registration form</p>
<hr>
</header>
<main>
<section>
<h2>Login Form</h2>
<form action="#" method = "post">
<fieldset>
<legend> Login</legend>
<label for = "loginEmail">
Email
</label>
<br>
<input type="email"
id = "loginEmail"
name="loginEmail"
placeholder="Enter Email"
required>
<br>
<label for = "loginPassword">
Password
</label>
<br>
<input type="password"
id = "loginPassword"
name="loginPassword"
placeholder="Enter Password"
required>

<br>
<input
type="checkbox"
id="remember"
name="remember">
<label for = "remember">
Remember Me
</label>
<br>
<button type="submit">
Login
</button>
<button type = "reset">
Clear
</button>
</fieldset>
</form>
</section>
<hr>
<section>
<h2>Registration Form</h2>
<form action="#" method= "post">
<fieldset>
<legend> Create Account</legend>
<label for = "fname">
First Name
</label>
<br>
<input
type="text"
id="fname"
name="fname"
placeholder="First Name"
required>
<br>
<label for="lname">
Last Name
</label>
<br>
<input type="text"
id="lname"
name="lname"
placeholder="Last Name"
required>
<br>
<label for="email">
Email
</label>
<br>
<input
type="email"
id="email"
name="email"
placeholder="example@email.com"
required>
<br>
<label for="password">
Password
</label>
<br>
<input
type="password"
id = "password"
name="password"
minlength="8"
required>
<br>
<label for ="confirm">
Confirm Password
</label>
<br>
<input
type="password"
id="confirm"
name="confirm"
required>
<br>
<label for="phone">
Mobile Number
</label>
<br>
<input
type="tel"
id="phone"
name="phone"
placeholder="+919876543210">
<br>
<label for="dob">
Date of Birth
</label>
<br>
<input
type="date"
id="dob"
name="dob">
<br>
<p>Gender</p>
<input
type="radio"
id="male"
name="gender"
value="Male">
<label for="male">
Male
</label>
<br>
<input type="radio"
id="female"
name="gender"
value="female">
<label for="female">
Female
</label>
<br>
<input
type="radio"
id="other"
name="gender'
value="other">
<label for="other">
Other </label>
<br>
<p>Hobbies</p>
<input
type="checkbox"
id = "coding"
name="hobby"
value="coding">
<label for="coding">
Coding
</label>
<br>
<input
type="checkbox"
id = "reading"
name="hobby"
value="Reading">
<label for ="reading">
Reading
</label>
<br>
<input 
type="checkbox"
id="music"
name="hobby"
value="Music">
<label for="music">
Music
</label>
<br>
<labe for ="address">
Address
</label>
<textarea
id="address"
name="address"
rows"5"
cols="40"
placeholder="Enter Address"></textarea>
<br>
<input 
type="checkbox"
id="terms"
required>
<label for ="terms">
I agree to the Terms & Conditions
</label>
<br>
<button type="submit">
Register
</button>
<button type="reset">
Reset
</button>
</fieldset>
</form>
</section>
</main>
<hr>
<footer>
<p>
HTML Forms Collection-Part 1
</p>
</footer>
</body>
</html>
