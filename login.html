<main>
<section>
<h2>Login</h2>
<p>
Enter your credentials to access your account.
</p>
<form action="#" method="post">
<fieldset>
<legend>Account Login</legend>
<p>
<label for="email">
Email Address:
</label>
<br>
<input type="email"
id=""email"
name="email"
placeholder="Enter your email"
autocomplete="email"
required>
</p>
<p>
<label for="password">
Password:
</label>
<br>
<input
type="password"
id="Password"
name="password"
placeholder="enter your password"
autocomplete="current-password"
minlength="*"
required>
</p>
<p>
<input
type="checkbox"
id="emember"
name="remember"
value="yes">
<label for="remember">
Remember me
</label>
</p>
<p>
<button type="submit">
Login
</button>
<button type="reset">
Clear
</button>
</p>
</fieldset>
</form>
</section>
<hr>
<section>
<h2>Account Options</h2>
<ul>
<li>
<a href="#">
Forgot Password?
</a>
</li>
<li><a href="registration.html">
Create New Account
</a>
</li>
</ul>
</section>
</main>
